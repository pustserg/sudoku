services:
  app:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: postgres://sudoku:sudoku@postgres:5432/sudoku?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sudoku
      POSTGRES_PASSWORD: sudoku
      POSTGRES_DB: sudoku
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudoku"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
